<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tipos de inputs</h1>
    <form action="procesa.php">
    <fieldset>
        <legend>Datos</legend>
    <p>
<label for="nom">Nombre</label>
<input type="text" maxlength="6"  
name="nombre" placeholder="Escriba su nombre"
id="nom">

    </p>
    <p>
        <label for="constraseña">Consetraseña</label>
        <input type="password"
        name="contraseña" required
        id="constraseña">
    </p>
    <p>
       Hombre:
       <input type="radio" value="H" name="genero">
       Mujer:
       <input type="radio" value="M" name="genero">  
    </p>
    <p>
        Fumador:
        <input type="checkbox" name="fuma"
        id="fumador">
    </p>
</fieldset>
<p>
    Provincia
    <select name="prov" id="prov">
    <option value="">Ciudad Real</option>
    <option value="">Albacete</option>
    <option value="">Murcia</option>
    <option value="">Lugo</option>
    </select>
    <p>
        <label for="">Observaciones</label>
        <textarea name="obs"
        cols="60" rows="3" 
        id="obs">
        
        </textarea>
    </p>
    <p>
        <label for="color">Color</label>
        <input type="color" name="color"
        id="color">
    </p>
    <p>
        <label for="fecha">Fecha</label>
        <input type="date" name="fecha-nac"
        id="fecha-nac">
    </p>
    <p>
        <label for="edad">Edad</label>
        <input type="number" name="edad"
        id="edad" min="0" max="100">
    
    </p>
    <p>
        <label for="email">Email</label>
        <input type="email" name="email"
        id="email">
    </p>
    <p>
        <label for="foto">Adjuntar foto</label>
        <input type="file" name="foto"
        id="foto">
    </p>
    <P>
        <label for="pob">Población</label>
        <input type="text"value="Alcazar de San Juan" maxlength="50"
        name="pob" disabled
        id="pob">
    </P>
</p>
<!--Botones de envio y reset-->
<p>
 <input type="submit" value="Enviar">
 <input type="reset"value="Reinciar formulario">  
</p>
</form>
</body>
</html>
